# Syntax (hyprpaper >= 0.8): one wallpaper block per monitor, empty monitor = fallback
# The path is a symlink maintained by scripts/wallpaper-grid.sh (Alt+W)
wallpaper {
    monitor =
    path = ~/.local/state/wallpaper/current
    fit_mode = cover
}

splash = false
# IPC lets wallpaper-grid.sh switch wallpaper without restarting hyprpaper
ipc = on
