# Syntax (hyprpaper >= 0.8): one wallpaper block per monitor, empty monitor = fallback
wallpaper {
    monitor =
    path = ~/.config/wallpaper/fog_forest_mono.png
    fit_mode = cover
}

# wallpaper {
#     monitor =
#     path = ~/.config/wallpaper/nordic_melancholy.jpg
#     fit_mode = cover
# }

splash = false
ipc = off
