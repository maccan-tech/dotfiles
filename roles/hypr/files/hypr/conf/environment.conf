##############################
# Environment Variables
##############################

env = WLR_NO_HARDWARE_CURSORS, 1
env = WLR_RENDERER_ALLOW_SOFTWARE, 1

# Cursor
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Bibata-Modern-Classic

# GTK dark mode (GTK3 env var + GTK4/libadwaita via gsettings color-scheme in gtk.sh)
env = GTK_THEME,Adwaita:dark

# Qt dark mode — gtk3 platform theme makes Qt follow the GTK theme
# Requires: qt5-qtstylePlugins (Qt5) / qt6-platformtheme-gtk3 (Qt6)
env = QT_QPA_PLATFORMTHEME,gtk3
env = QT_QPA_PLATFORM,wayland;xcb

# App compatibility
env = XDG_CURRENT_DESKTOP,Hyprland:GNOME
