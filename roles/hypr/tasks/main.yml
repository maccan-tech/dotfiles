---
# vim: set filetype=yaml.ansible : #
#
- name: Hypr | Install dnf-plugins-core to handle copr
  when: ansible_facts['os_family'] == 'RedHat'
  ansible.builtin.dnf:
    name: dnf-plugins-core
    state: present
  become: true

- name: Hypr | Add copr-repo
  when: ansible_facts['os_family'] == 'RedHat'
  ansible.builtin.command: dnf copr enable {{ item.repo }} -y
  args:
    creates: /etc/yum.repos.d/_copr:copr.fedorainfracloud.org:{{ item.repo | replace('/', ':') }}.repo
  loop:
    - { repo: "solopasha/hyprland" }
    - { repo: "erikreider/swayosd" }
  become: true

- name: Hypr | Update dnf cache
  when: ansible_facts['os_family'] == 'RedHat'
  ansible.builtin.dnf:
    update_cache: true
  become: true

- name: "Hypr | Install RedHat packages"
  when: ansible_facts['os_family'] == 'RedHat'
  ansible.builtin.dnf5:
    name:
      - hyprland
      - hyprlock
      - hypridle
      - hyprpolkitagent
      - hyprpaper
      - hyprutils
      - hyprcursor
      - hyprsysteminfo
      - waybar
      - SwayNotificationCenter
      - cliphist
      # - grim
      - slurp
      - swappy
      - rofi-wayland
      - wayland-logout
      - Thunar
      - satty
      - hyprshot
      # - nmcli
      - NetworkManager
      - qrencode
      - swayosd
      # Qt5 dark mode — lets QT_QPA_PLATFORMTHEME=gtk3 work for Qt5 apps
      - qt5-qtstyleplugins
      # Qt6 dark mode — qt6ct provides a color-scheme-aware platform theme for Qt6 apps
      - qt6ct
      # Icon theme with proper light-colored systray icons for dark environments
      - papirus-icon-theme
    state: present
  become: true

- name: "Hypr | Enable and start swayosd-libinput-backend service"
  when: ansible_facts['os_family'] == 'RedHat'
  ansible.builtin.systemd:
    name: swayosd-libinput-backend
    state: started
    enabled: true
  become: true

- name: "Hypr | Clone hyprltm-net"
  ansible.builtin.git:
    repo: "https://github.com/hyprltm/hyprltm-net.git"
    dest: "{{ ansible_facts['user_dir'] }}/github/hyprltm-net"
    version: "stable"
    update: true

- name: "Hypr | Create install directories for hyprltm-net"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ ansible_facts['user_dir'] }}/.local/bin"
    - "{{ ansible_facts['user_dir'] }}/.config/rofi/themes"

- name: "Hypr | Install hyprltm-net executable"
  ansible.builtin.copy:
    src: "{{ ansible_facts['user_dir'] }}/github/hyprltm-net/hyprltm-net.sh"
    dest: "{{ ansible_facts['user_dir'] }}/.local/bin/hyprltm-net"
    mode: "0755"
    remote_src: true

- name: "Hypr | Find hyprltm-net rofi themes"
  ansible.builtin.find:
    paths: "{{ ansible_facts['user_dir'] }}/github/hyprltm-net"
    patterns: "*.rasi"
  register: hyprltm_rasi_files

- name: "Hypr | Install hyprltm-net rofi themes"
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ ansible_facts['user_dir'] }}/.config/rofi/themes/"
    mode: "0644"
    remote_src: true
  loop: "{{ hyprltm_rasi_files.files }}"
  # Exclude files we maintain ourselves in roles/hypr/files/rofi/themes/
  when: item.path | basename not in ['ltmnight.rasi']

- name: "Hypr | Copy config files"
  when: ansible_facts['os_family'] == 'RedHat'
  ansible.posix.synchronize:
    src: "{{ role_path }}/files/"
    dest: "{{ ansible_facts['user_dir'] }}/.config"
    archive: true
    checksum: true

- name: "Hypr | chmod script files"
  when: ansible_facts['os_family'] == 'RedHat'
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "0755"
  with_fileglob:
    - "{{ ansible_facts['user_dir'] }}/.config/hypr/scripts/*"

- name: "Hypr | chmod gtk.sh file"
  when: ansible_facts['os_family'] == 'RedHat'
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/hypr/gtk.sh"
    mode: "0755"

- name: "Hypr | chmod sratrhypr.sh file"
  when: ansible_facts['os_family'] == 'RedHat'
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/hypr/starthypr.sh"
    mode: "0755"

- name: "Hypr | chmod launch.sh file"
  when: ansible_facts['os_family'] == 'RedHat'
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/waybar/launch.sh"
    mode: "0755"

- name: "Hypr | chmod logoutlaunch.sh file"
  when: ansible_facts['os_family'] == 'RedHat'
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/wlogout/logoutlaunch.sh"
    mode: "0755"
