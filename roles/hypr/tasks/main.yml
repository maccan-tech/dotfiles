---
# vim: set filetype=yaml.ansible : #
#
- name: Hypr | Install dnf-plugins-core to handle copr
  when: ansible_facts['os_family'] == 'RedHat'
  ansible.builtin.dnf:
    name: dnf-plugins-core
    state: present
  become: true

- name: Hypr | Add copr-repo
  when: ansible_facts['os_family'] == 'RedHat'
  ansible.builtin.command: dnf copr enable {{ item.repo }} -y
  args:
    creates: /etc/yum.repos.d/_copr:copr.fedorainfracloud.org:{{ item.repo | replace('/', ':') }}.repo
  loop:
    - { repo: "lionheartp/Hyprland" }
    - { repo: "erikreider/swayosd" }
    - { repo: "lihaohong/yazi" }
  become: true

- name: Hypr | Update dnf cache
  when:
    - ansible_facts['os_family'] == 'RedHat'
  ansible.builtin.dnf:
    update_cache: true
  become: true

- name: "Hypr | Install RedHat packages"
  when: ansible_facts['os_family'] == 'RedHat'
  ansible.builtin.dnf5:
    name:
      - hyprland
      - hyprlock
      - hypridle
      - hyprpolkitagent
      - hyprpaper
      - hyprutils
      - hyprcursor
      - hyprsysteminfo
      - btop
      - hyprsunset
      - hyprland-guiutils
      - ImageMagick
      - jq
      - SwayNotificationCenter
      - cliphist
      - slurp
      - swappy
      - rofi-wayland
      - wayland-logout
      - Thunar
      - yazi
      - satty
      - hyprshot
      - NetworkManager
      - qrencode
      - swayosd
      - papirus-icon-theme
      - cargo
      # Needed to build bluetui
      - dbus-devel
    state: present
  become: true

# waybar 0.15.0 sends hyprlang dispatch commands, so clicking a workspace
# does nothing with the Lua config. Fixed upstream (Waybar PR #5013/#5231)
# but not yet released; waybar-git from the lionheartp copr has the fix and
# conflicts with waybar, hence allowerasing.
- name: "Hypr | Install waybar-git (replaces waybar)"
  when: ansible_facts['os_family'] == 'RedHat'
  ansible.builtin.dnf5:
    name: "waybar-git"
    state: present
    allowerasing: true
  become: true

# Bluetooth TUI opened from the settings menu (Alt+Shift+S) and waybar.
# Installed into ~/.local so the binary ends up in ~/.local/bin, which is on PATH.
- name: "Hypr | Install bluetui with cargo"
  when: ansible_facts['os_family'] == 'RedHat'
  community.general.cargo:
    name: "bluetui"
    path: "{{ ansible_facts['user_dir'] }}/.local"
    locked: true
    state: present

- name: "Hypr | Enable and start swayosd-libinput-backend service"
  when: ansible_facts['os_family'] == 'RedHat'
  ansible.builtin.systemd:
    name: swayosd-libinput-backend
    state: started
    enabled: true
  become: true

- name: "Hypr | Clone hyprltm-net"
  ansible.builtin.git:
    repo: "https://github.com/hyprltm/hyprltm-net.git"
    dest: "{{ ansible_facts['user_dir'] }}/github/hyprltm-net"
    version: "stable"
    update: true

- name: "Hypr | Create install directories for hyprltm-net"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ ansible_facts['user_dir'] }}/.local/bin"
    - "{{ ansible_facts['user_dir'] }}/.config/rofi/themes"

# hyprltm-net >= 0.5 sources modules/*.sh next to its own path, so run it
# from the clone instead of copying the script on its own. The script is not
# executable in the repo, hence the bash wrapper.
- name: "Hypr | Install hyprltm-net executable"
  ansible.builtin.copy:
    content: |
      #!/bin/sh
      exec bash "{{ ansible_facts['user_dir'] }}/github/hyprltm-net/hyprltm-net.sh" "$@"
    dest: "{{ ansible_facts['user_dir'] }}/.local/bin/hyprltm-net"
    mode: "0755"
    follow: false

- name: "Hypr | Find hyprltm-net rofi themes"
  ansible.builtin.find:
    paths: "{{ ansible_facts['user_dir'] }}/github/hyprltm-net"
    patterns: "*.rasi"
  register: hyprltm_rasi_files

- name: "Hypr | Install hyprltm-net rofi themes"
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ ansible_facts['user_dir'] }}/.config/rofi/themes/"
    mode: "0644"
    remote_src: true
  loop: "{{ hyprltm_rasi_files.files }}"
  # Exclude files we maintain ourselves in roles/hypr/files/rofi/themes/
  when: item.path | basename not in ['ltmnight.rasi']

- name: "Hypr | Copy config files"
  when: ansible_facts['os_family'] == 'RedHat'
  ansible.posix.synchronize:
    src: "{{ role_path }}/files/"
    dest: "{{ ansible_facts['user_dir'] }}/.config"
    archive: true
    checksum: true
    # Wallpapers are pictures, not config; they go to ~/Pictures/Wallpapers
    rsync_opts:
      - "--exclude=/wallpaper/"

- name: "Hypr | Copy wallpapers"
  when: ansible_facts['os_family'] == 'RedHat'
  ansible.builtin.copy:
    src: "wallpaper/"
    dest: "{{ ansible_facts['user_dir'] }}/Pictures/Wallpapers/"
    mode: "0644"
    directory_mode: "0755"

- name: "Hypr | Create wallpaper state directory"
  when: ansible_facts['os_family'] == 'RedHat'
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.local/state/wallpaper"
    state: directory
    mode: "0755"

- name: "Hypr | Check current wallpaper link"
  when: ansible_facts['os_family'] == 'RedHat'
  ansible.builtin.stat:
    path: "{{ ansible_facts['user_dir'] }}/.local/state/wallpaper/current"
  register: hypr_current_wallpaper

# hyprpaper.conf and hyprlock.conf read this link; only set a default so a
# wallpaper chosen with Alt+W is kept
- name: "Hypr | Set default wallpaper"
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - not hypr_current_wallpaper.stat.exists
  ansible.builtin.file:
    src: "{{ ansible_facts['user_dir'] }}/Pictures/Wallpapers/fog_forest_mono.png"
    dest: "{{ ansible_facts['user_dir'] }}/.local/state/wallpaper/current"
    state: link

# Hyprland 0.55+ uses hyprland.lua; synchronize does not delete files, so the
# legacy hyprlang config would otherwise linger next to the Lua config
- name: "Hypr | Remove legacy hyprlang config files"
  when: ansible_facts['os_family'] == 'RedHat'
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/hypr/{{ item }}"
    state: absent
  loop:
    - "hyprland.conf"
    - "conf/animations.conf"
    - "conf/autostart.conf"
    - "conf/decoration.conf"
    - "conf/environment.conf"
    - "conf/keybindings.conf"
    - "conf/keyboard.conf"
    - "conf/layouts.conf"
    - "conf/misc.conf"
    - "conf/window.conf"
    - "conf/windowrules.conf"

- name: "Hypr | chmod script files"
  when: ansible_facts['os_family'] == 'RedHat'
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "0755"
  with_fileglob:
    - "{{ ansible_facts['user_dir'] }}/.config/hypr/scripts/*"

- name: "Hypr | chmod gtk.sh file"
  when: ansible_facts['os_family'] == 'RedHat'
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/hypr/gtk.sh"
    mode: "0755"

- name: "Hypr | chmod sratrhypr.sh file"
  when: ansible_facts['os_family'] == 'RedHat'
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/hypr/starthypr.sh"
    mode: "0755"

- name: "Hypr | chmod launch.sh file"
  when: ansible_facts['os_family'] == 'RedHat'
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/waybar/launch.sh"
    mode: "0755"

- name: "Hypr | chmod logoutlaunch.sh file"
  when: ansible_facts['os_family'] == 'RedHat'
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/wlogout/logoutlaunch.sh"
    mode: "0755"
