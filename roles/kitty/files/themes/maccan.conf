# vim:fileencoding=utf-8:ft=conf

font_family      Jet Brains Nerd Font Mono 
italic_font      auto
bold_font        auto
bold_italic_font auto

foreground       #c0b18b
background       #262626
selection_foreground #2f2f2f
selection_background #d75f5f

active_border_color #ffffff
inactive_border_color #cccccc

active_tab_foreground #000
active_tab_background #eee
inactive_tab_foreground #444
inactive_tab_background #999

# black
color0   #2f2f2f
color8   #656565

# red
color1   #d75f5f
color9   #d75f5f

# green
color2   #d4d232
color10  #8fee96

# yellow
color3   #af865a
color11  #cd950c

# blue — ncurses dialog backgrounds (nmtui, dialog etc) use this
color4   #4f9fcf
color12  #6ab8e8

# magenta
color5   #b07a8a
color13  #cc99aa

# cyan — renders on top of blue (color4) backgrounds in ncurses
# warm gold: high contrast, easily readable on the teal-blue dialog bg
color6   #D4A84B
color14  #E8C472

# white
color7   #c0b18b
color15  #d8d8d8
